<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KeyStore VIP - Bản Hoàn Hảo V4</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* ================= CSS TÍCH HỢP FULL V4 ================= */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #7c3aed; --primary-light: #a78bfa; --accent: #ec4899;
      --gold: #fbbf24; --dark: #0a0a1a; --dark-2: #12122a;
      --card-bg: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1);
      --text: #ffffff; --text-muted: #a0a0b8; --success: #10b981; --danger: #ef4444;
    }
    /* Light Mode */
    body.light-mode {
      --dark: #f3f4f6; --dark-2: #ffffff; --text: #111827; --text-muted: #4b5563;
      --border: #e5e7eb; --card-bg: #ffffff;
    }
    body { font-family: 'Poppins', sans-serif; background: var(--dark); color: var(--text); overflow-x: hidden; min-height: 100vh; transition: background 0.3s, color 0.3s; }
    
    /* Background */
    .bg-animation { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: radial-gradient(ellipse at top, #1a1a3e 0%, var(--dark) 60%); transition: background 0.3s; }
    body.light-mode .bg-animation { background: radial-gradient(ellipse at top, #e0e7ff 0%, #f3f4f6 60%); }
    .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.4; animation: float 20s infinite ease-in-out; }
    .orb1 { width: 500px; height: 500px; background: var(--primary); top: -100px; left: -100px; }
    .orb2 { width: 400px; height: 400px; background: var(--accent); bottom: 100px; right: -100px; animation-delay: -5s; }
    .orb3 { width: 350px; height: 350px; background: var(--gold); top: 50%; left: 50%; opacity: 0.2; animation-delay: -10s; }
    @keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(80px, -60px) scale(1.1); } 66% { transform: translate(-60px, 80px) scale(0.9); } }

    /* Navbar */
    .navbar { position: fixed; top: 0; width: 100%; z-index: 100; backdrop-filter: blur(20px); background: rgba(10, 10, 26, 0.8); border-bottom: 1px solid var(--border); transition: all 0.3s; }
    body.light-mode .navbar { background: rgba(255, 255, 255, 0.8); }
    .nav-container { max-width: 1300px; margin: 0 auto; padding: 0.8rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 10px; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.4rem; color: var(--text); }
    .logo i { color: var(--gold); font-size: 1.6rem; }
    .vip-text { background: linear-gradient(135deg, var(--gold), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .nav-actions { display: flex; gap: 1rem; align-items: center; }
    .icon-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border); color: var(--text); width: 42px; height: 42px; border-radius: 10px; cursor: pointer; font-size: 1rem; transition: all 0.3s; position: relative; }
    .icon-btn:hover { background: var(--primary); color: white; transform: translateY(-2px); }
    .badge-dot { position: absolute; top: -5px; right: -5px; background: var(--accent); color: white; font-size: 0.65rem; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .login-btn { padding: 0.6rem 1.4rem; background: linear-gradient(135deg, var(--primary), var(--accent)); border: none; border-radius: 10px; color: white; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 0.9rem; }

    /* Hero & Search */
    .hero { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 120px 2rem 4rem; text-align: center; }
    .hero-title { font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 900; line-height: 1.2; margin-bottom: 1rem; }
    .gradient-text { background: linear-gradient(135deg, var(--primary-light), var(--accent), var(--gold)); background-size: 200% 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: gradientMove 4s ease infinite; }
    @keyframes gradientMove { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    .search-bar { display: flex; max-width: 500px; margin: 2rem auto; background: var(--card-bg); border: 1px solid var(--border); border-radius: 50px; padding: 0.4rem 0.4rem 0.4rem 1.5rem; align-items: center; }
    .search-bar input { flex: 1; background: none; border: none; color: var(--text); outline: none; font-family: inherit; }
    .search-bar button { background: var(--primary); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }

    /* Products */
    .products { max-width: 1300px; margin: 0 auto; padding: 2rem; }
    .filter-tabs { display: flex; justify-content: center; gap: 0.7rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .tab { padding: 0.5rem 1.4rem; background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); border-radius: 50px; cursor: pointer; font-family: inherit; font-weight: 500; transition: all 0.3s; font-size: 0.85rem; }
    .tab.active { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; border-color: transparent; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
    .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; position: relative; transition: all 0.3s; display: flex; flex-direction: column; }
    .product-card:hover { transform: translateY(-5px); border-color: var(--primary-light); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    .product-badge { position: absolute; top: 1rem; right: 1rem; padding: 0.2rem 0.6rem; background: linear-gradient(135deg, var(--accent), var(--gold)); color: white; font-size: 0.65rem; font-weight: 700; border-radius: 50px; }
    .product-icon { width: 60px; height: 60px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin-bottom: 1rem; background: rgba(124,58,237,0.1); }
    .product-card h3 { font-size: 1.05rem; margin-bottom: 0.3rem; cursor: pointer; }
    .product-card h3:hover { color: var(--primary-light); }
    .product-desc { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 0.5rem; flex: 1; }
    .rating { color: var(--gold); font-size: 0.8rem; margin-bottom: 1rem; }
    .product-price { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .price { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--gold); }
    .price-old { font-size: 0.75rem; color: var(--text-muted); text-decoration: line-through; margin-left: 5px; }
    .add-btn { padding: 0.5rem 1rem; background: linear-gradient(135deg, var(--primary), var(--accent)); border: none; color: white; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 0.8rem; }

    /* Modals */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .modal.active { display: flex; }
    .modal-content { background: var(--dark-2); border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 480px; max-height: 90vh; display: flex; flex-direction: column; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--dark-2); z-index: 10; border-radius: 20px 20px 0 0; }
    .close-btn { background: none; border: none; color: var(--text); font-size: 1.8rem; cursor: pointer; }
    .hidden { display: none !important; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 5px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; }
    body.light-mode .form-group input { background: #fff; border-color: #ccc; color: #000; }
    .btn-primary.full { width: 100%; padding: 0.8rem; background: linear-gradient(135deg, var(--primary), var(--accent)); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; }

    /* User & Admin */
    .admin-modal { max-width: 850px; }
    .admin-tabs { display: flex; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .admin-tab { padding: 1rem; background: none; border: none; color: var(--text-muted); font-family: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .admin-tab.active { color: var(--text); border-bottom: 2px solid var(--primary); }
    .admin-body { padding: 1.5rem; max-height: 60vh; overflow-y: auto; }
    .admin-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .admin-table th, .admin-table td { padding: 0.6rem; text-align: left; border-bottom: 1px solid var(--border); }
    
    /* Key & Review */
    .key-box { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); padding: 0.6rem; border-radius: 6px; font-family: monospace; color: var(--success); text-align: center; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
    .copy-btn { background: var(--success); border: none; color: white; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; }
    .review-item { padding: 1rem 0; border-bottom: 1px solid var(--border); }
    .star-rating { display: flex; gap: 5px; font-size: 1.5rem; color: var(--gold); cursor: pointer; }

    /* Notification Dropdown */
    .notif-dropdown { position: absolute; top: 50px; right: 0; width: 300px; background: var(--dark-2); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; display: none; z-index: 200; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .notif-dropdown.show { display: block; }
    .notif-item { font-size: 0.8rem; padding: 0.5rem 0; border-bottom: 1px solid var(--border); color: var(--text-muted); }

    /* Toast & Others */
    .toast { position: fixed; bottom: 20px; right: 20px; padding: 1rem 1.5rem; background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; border-radius: 10px; transform: translateX(200%); transition: transform 0.4s; z-index: 2000; font-size: 0.9rem; }
    .toast.show { transform: translateX(0); }
    @media (max-width: 768px) { .toast { left: 15px; right: 15px; transform: translateY(200%); } .toast.show { transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="bg-animation"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>

  <nav class="navbar">
    <div class="nav-container">
      <div class="logo"><i class="fas fa-key"></i><span>KeyStore <span class="vip-text">VIP</span></span></div>
      <div class="nav-actions">
        <!-- Chuông thông báo -->
        <div style="position:relative">
          <button class="icon-btn" id="notifBtn"><i class="fas fa-bell"></i><span class="badge-dot" id="notifBadge" style="display:none">!</span></button>
          <div class="notif-dropdown" id="notifDropdown">
            <h4 style="margin-bottom:10px;font-size:0.9rem">Thông báo của bạn</h4>
            <div id="notifList"><div class="notif-item">Chưa có thông báo nào.</div></div>
          </div>
        </div>
        <!-- Chế độ sáng tối -->
        <button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
        <!-- Giỏ hàng -->
        <button class="icon-btn" id="cartBtn"><i class="fas fa-shopping-cart"></i><span class="badge-dot" id="cartCount">0</span></button>
        <!-- Đăng nhập -->
        <div id="authArea"></div>
      </div>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-content">
      <h1 class="hero-title">Mua <span class="gradient-text">Key Bản Quyền</span><br/>Uy Tín Số 1</h1>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm..." />
        <button onclick="renderProducts('all')"><i class="fas fa-search"></i></button>
      </div>
    </div>
  </section>

  <section class="products">
    <div class="filter-tabs">
      <button class="tab active" data-filter="all">Tất Cả</button>
      <button class="tab" data-filter="windows">Windows</button>
      <button class="tab" data-filter="office">Office</button>
      <button class="tab" data-filter="game">Game</button>
    </div>
    <div class="product-grid" id="productGrid"></div>
  </section>

  <!-- MODALS -->
  <!-- Auth Modal -->
  <div class="modal" id="authModal">
    <div class="modal-content">
      <div class="modal-header"><h3><i class="fas fa-user-shield"></i> <span id="authTitle">Đăng Nhập</span></h3><button class="close-btn">&times;</button></div>
      <div style="display:flex;border-bottom:1px solid var(--border)">
        <button class="auth-tab active" data-auth="login" style="flex:1;padding:1rem;background:none;border:none;color:var(--text);font-weight:bold">Đăng Nhập</button>
        <button class="auth-tab" data-auth="register" style="flex:1;padding:1rem;background:none;border:none;color:var(--text-muted)">Đăng Ký</button>
      </div>
      <form id="loginForm" style="padding:1.5rem">
        <div class="form-group"><label>Tài khoản</label><input type="text" id="loginUser" required /></div>
        <div class="form-group"><label>Mật khẩu</label><input type="password" id="loginPass" required /></div>
        <button type="submit" class="btn-primary full">Đăng Nhập</button>
      </form>
      <form id="registerForm" class="hidden" style="padding:1.5rem">
        <div class="form-group"><label>Tài khoản</label><input type="text" id="regUser" required /></div>
        <div class="form-group"><label>Email</label><input type="email" id="regEmail" required /></div>
        <div class="form-group"><label>Mật khẩu</label><input type="password" id="regPass" required /></div>
        <button type="submit" class="btn-primary full">Tạo Tài Khoản</button>
      </form>
    </div>
  </div>

  <!-- Profile Modal -->
  <div class="modal" id="profileModal">
    <div class="modal-content">
      <div class="modal-header"><h3><i class="fas fa-user-circle"></i> Tài Khoản</h3><button class="close-btn">&times;</button></div>
      <div style="padding:1.5rem">
        <div style="background:rgba(124,58,237,0.1);padding:1rem;border-radius:10px;display:flex;justify-content:space-between;margin-bottom:1rem">
          <div><p style="font-size:0.8rem;color:var(--text-muted)">Số dư</p><h3 id="profileBalance" style="color:var(--gold);font-family:'Orbitron'">0đ</h3></div>
          <button class="btn-primary" id="openDepositBtn" style="padding:0.5rem 1rem;font-size:0.8rem">Nạp Tiền</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem">
          <button class="action-btn" onclick="renderHistory()" style="padding:0.8rem;border-radius:8px;border:1px solid var(--border);background:none;color:var(--text);cursor:pointer"><i class="fas fa-history"></i> Lịch Sử</button>
          <button class="action-btn" id="adminPanelBtn" style="display:none;padding:0.8rem;border-radius:8px;border:1px solid var(--gold);background:rgba(251,191,36,0.1);color:var(--gold);cursor:pointer"><i class="fas fa-crown"></i> Admin</button>
          <button id="logoutBtn" style="grid-column:span 2;padding:0.8rem;border-radius:8px;border:none;background:rgba(239,68,68,0.1);color:var(--danger);cursor:pointer;font-weight:bold"><i class="fas fa-sign-out-alt"></i> Đăng Xuất</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick View Modal -->
  <div class="modal" id="quickViewModal">
    <div class="modal-content">
      <div class="modal-header"><h3>Chi Tiết Sản Phẩm</h3><button class="close-btn">&times;</button></div>
      <div id="quickViewBody" style="padding:1.5rem"></div>
    </div>
  </div>

  <!-- Admin Modal -->
  <div class="modal" id="adminModal">
    <div class="modal-content admin-modal">
      <div class="modal-header"><h3><i class="fas fa-crown" style="color:var(--gold)"></i> Admin Panel V4</h3><button class="close-btn">&times;</button></div>
      <div class="admin-tabs">
        <button class="admin-tab active" data-admin="users">Quản Lý User</button>
        <button class="admin-tab" data-admin="vouchers">Tạo Voucher</button>
        <button class="admin-tab" data-admin="logs">Lịch Sử Hệ Thống</button>
      </div>
      <div class="admin-body" id="adminBody"></div>
    </div>
  </div>

  <div class="modal" id="cartModal">
    <div class="modal-content">
      <div class="modal-header"><h3><i class="fas fa-shopping-cart"></i> Giỏ Hàng</h3><button class="close-btn">&times;</button></div>
      <div id="cartItems" style="padding:1.5rem;max-height:300px;overflow-y:auto"></div>
      <div style="padding:1.5rem;border-top:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;margin-bottom:1rem;font-weight:bold">Tổng: <span id="cartTotal" style="color:var(--gold)">0đ</span></div>
        <button class="btn-primary full" id="checkoutBtn">Thanh Toán</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ================= JAVASCRIPT V4 ================= */
    // Dữ liệu khởi tạo
    let products = JSON.parse(localStorage.getItem("v4_products")) || [
      { id: 1, name: "Windows 11 Pro", desc: "Key vĩnh viễn", price: 350000, oldPrice: 500000, category: "windows", icon: "fa-windows", rating: [5,4,5], reviews: [{user:"Nam", text:"Rất tốt", star:5}] },
      { id: 2, name: "Office 2021", desc: "Key vĩnh viễn", price: 450000, oldPrice: 700000, category: "office", icon: "fa-file-word", rating: [5], reviews: [] },
      { id: 3, name: "GTA V", desc: "Steam Key", price: 550000, oldPrice: 900000, category: "game", icon: "fa-gamepad", rating: [4,4], reviews: [] }
    ];
    
    let users = JSON.parse(localStorage.getItem("v4_users")) || [
      { id: 'admin', username: 'admin', password: 'admin123', role: 'admin', balance: 10000000, status: 'active' }
    ];
    
    let orders = JSON.parse(localStorage.getItem("v4_orders")) || [];
    let logs = JSON.parse(localStorage.getItem("v4_logs")) || [];
    let notifs = JSON.parse(localStorage.getItem("v4_notifs")) || [];
    let vouchers = JSON.parse(localStorage.getItem("v4_vouchers")) || [{ code: "VIP10", type: "percent", value: 10 }];
    let session = JSON.parse(localStorage.getItem("v4_session")) || null;
    let cart = [];

    function saveAll() {
      localStorage.setItem("v4_products", JSON.stringify(products));
      localStorage.setItem("v4_users", JSON.stringify(users));
      localStorage.setItem("v4_orders", JSON.stringify(orders));
      localStorage.setItem("v4_logs", JSON.stringify(logs));
      localStorage.setItem("v4_notifs", JSON.stringify(notifs));
      localStorage.setItem("v4_vouchers", JSON.stringify(vouchers));
      localStorage.setItem("v4_session", JSON.stringify(session));
    }

    // Utils
    const formatPrice = (p) => p.toLocaleString("vi-VN") + "đ";
    const showToast = (msg) => {
      const t = document.getElementById("toast"); t.innerHTML = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    };
    const getCurrentUser = () => session ? users.find(u => u.id === session.id) : null;
    
    // Log hệ thống
    function addLog(action) {
      logs.unshift({ time: new Date().toLocaleString('vi-VN'), action, user: session ? session.username : 'Khách' });
      saveAll();
    }

    // Render Giao diện
    function renderProducts(filter = "all") {
      const grid = document.getElementById("productGrid");
      const search = document.getElementById("searchInput").value.toLowerCase();
      let filtered = products;
      if (filter !== "all") filtered = filtered.filter(p => p.category === filter);
      if (search) filtered = filtered.filter(p => p.name.toLowerCase().includes(search));
      
      grid.innerHTML = filtered.map(p => {
        const avgRating = p.rating.length > 0 ? (p.rating.reduce((a,b)=>a+b,0)/p.rating.length).toFixed(1) : "0.0";
        return `
        <div class="product-card">
          <div class="product-icon"><i class="fab ${p.icon}" style="color:var(--primary)"></i></div>
          <h3 onclick="openQuickView(${p.id})">${p.name}</h3>
          <p class="product-desc">${p.desc}</p>
          <div class="rating"><i class="fas fa-star"></i> ${avgRating} (${p.reviews.length} đánh giá)</div>
          <div class="product-price">
            <div><span class="price">${formatPrice(p.price)}</span></div>
            <button class="add-btn" onclick="addToCart(${p.id})"><i class="fas fa-cart-plus"></i></button>
          </div>
        </div>
      `}).join("");
    }

    function renderAuthUI() {
      const area = document.getElementById('authArea');
      const user = getCurrentUser();
      if (user) {
        area.innerHTML = `<button class="login-btn" id="profileBtn" style="background:rgba(255,255,255,0.1)"><i class="fas fa-user"></i> ${user.username}</button>`;
        document.getElementById('profileBtn').onclick = () => {
          document.getElementById('profileBalance').textContent = formatPrice(user.balance);
          document.getElementById('adminPanelBtn').style.display = user.role === 'admin' ? 'block' : 'none';
          document.getElementById('profileModal').classList.add('active');
        };
      } else {
        area.innerHTML = `<button class="login-btn" id="loginBtn">Đăng Nhập</button>`;
        document.getElementById('loginBtn').onclick = () => document.getElementById('authModal').classList.add('active');
      }
      // Render thông báo
      const notifList = document.getElementById('notifList');
      const myNotifs = notifs.filter(n => n.userId === 'all' || (user && n.userId === user.id));
      if (myNotifs.length > 0) {
        document.getElementById('notifBadge').style.display = 'flex';
        notifList.innerHTML = myNotifs.map(n => `<div class="notif-item"><i class="fas fa-info-circle"></i> ${n.text}</div>`).join("");
      } else {
        document.getElementById('notifBadge').style.display = 'none';
        notifList.innerHTML = `<div class="notif-item">Không có thông báo.</div>`;
      }
    }

    // Xem nhanh
    function openQuickView(id) {
      const p = products.find(x => x.id === id);
      document.getElementById('quickViewBody').innerHTML = `
        <h2 style="margin-bottom:5px">${p.name}</h2>
        <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:1rem">${p.desc}</p>
        <h3 style="color:var(--gold);margin-bottom:1rem">${formatPrice(p.price)}</h3>
        <button class="btn-primary full" onclick="addToCart(${p.id}); document.getElementById('quickViewModal').classList.remove('active')">Thêm vào giỏ</button>
        
        <h4 style="margin-top:1.5rem;margin-bottom:0.5rem;border-bottom:1px solid var(--border);padding-bottom:5px">Đánh giá</h4>
        <div style="margin-bottom:1rem">
          <div class="star-rating" id="starRating">
            <i class="far fa-star" onclick="setStar(1)"></i><i class="far fa-star" onclick="setStar(2)"></i><i class="far fa-star" onclick="setStar(3)"></i><i class="far fa-star" onclick="setStar(4)"></i><i class="far fa-star" onclick="setStar(5)"></i>
          </div>
          <textarea id="reviewText" placeholder="Nhập đánh giá..." style="width:100%;padding:0.5rem;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);margin-top:5px;border-radius:8px"></textarea>
          <button onclick="submitReview(${p.id})" style="margin-top:5px;padding:0.5rem 1rem;background:var(--primary);border:none;color:white;border-radius:5px;cursor:pointer">Gửi Đánh Giá</button>
        </div>
        <div>${p.reviews.map(r => `<div class="review-item"><b>${r.user}</b> <span style="color:var(--gold)">${'★'.repeat(r.star)}</span><br><span style="font-size:0.85rem">${r.text}</span></div>`).join('')}</div>
      `;
      document.getElementById('quickViewModal').classList.add('active');
    }

    let tempStar = 5;
    window.setStar = (s) => {
      tempStar = s;
      const stars = document.querySelectorAll('#starRating i');
      stars.forEach((el, i) => el.className = i < s ? 'fas fa-star' : 'far fa-star');
    }
    window.submitReview = (id) => {
      const user = getCurrentUser();
      if (!user) return showToast('Vui lòng đăng nhập để đánh giá!');
      const text = document.getElementById('reviewText').value;
      if (!text) return showToast('Nhập nội dung đánh giá!');
      const p = products.find(x => x.id === id);
      p.reviews.push({ user: user.username, text, star: tempStar });
      p.rating.push(tempStar);
      saveAll(); renderProducts(); openQuickView(id); showToast('Cảm ơn đánh giá của bạn!');
    }

    // Giỏ hàng & Checkout (Rút gọn)
    window.addToCart = (id) => {
      const p = products.find(x => x.id === id);
      const ex = cart.find(x => x.id === id);
      if (ex) ex.quantity += 1; else cart.push({ ...p, quantity: 1 });
      document.getElementById('cartCount').textContent = cart.reduce((s,i)=>s+i.quantity,0);
      showToast('Đã thêm vào giỏ!');
    }
    
    document.getElementById('cartBtn').onclick = () => {
      const c = document.getElementById('cartItems');
      c.innerHTML = cart.map(i => `<div style="display:flex;justify-content:space-between;margin-bottom:10px"><span>${i.name} x${i.quantity}</span><span style="color:var(--gold)">${formatPrice(i.price*i.quantity)}</span></div>`).join("");
      document.getElementById('cartTotal').textContent = formatPrice(cart.reduce((s,i)=>s+i.price*i.quantity,0));
      document.getElementById('cartModal').classList.add('active');
    }

    document.getElementById('checkoutBtn').onclick = () => {
      const user = getCurrentUser();
      if (!user) return showToast('Vui lòng đăng nhập!');
      const total = cart.reduce((s,i)=>s+i.price*i.quantity,0);
      if (user.balance < total) return showToast('Số dư không đủ!');
      
      user.balance -= total;
      cart.forEach(i => orders.push({ id: Date.now(), userId: user.id, name: i.name, price: i.price, time: new Date().toLocaleString() }));
      addLog(`Mua hàng thành công: ${formatPrice(total)}`);
      cart = []; saveAll(); renderAuthUI(); document.getElementById('cartModal').classList.remove('active');
      showToast('<i class="fas fa-check"></i> Thanh toán thành công!');
    }

    // Admin Render
    function renderAdminTab(tab) {
      const b = document.getElementById('adminBody');
      if (tab === 'users') {
        b.innerHTML = `<table class="admin-table"><thead><tr><th>Username</th><th>Số dư</th><th>Trạng thái</th><th>Role</th><th>Hành động</th></tr></thead>
        <tbody>${users.map(u => `<tr>
          <td>${u.username}</td><td style="color:var(--gold)">${formatPrice(u.balance)}</td>
          <td><span style="color:${u.status==='active'?'var(--success)':'var(--danger)'}">${u.status}</span></td>
          <td>${u.role}</td>
          <td>
            <button onclick="toggleStatus('${u.id}')" style="background:${u.status==='active'?'var(--danger)':'var(--success)'};border:none;color:white;padding:2px 5px;border-radius:3px;cursor:pointer">${u.status==='active'?'Khóa':'Mở'}</button>
            <button onclick="makeAdmin('${u.id}')" style="background:var(--gold);border:none;color:black;padding:2px 5px;border-radius:3px;cursor:pointer">Cấp Admin</button>
            <button onclick="editBalance('${u.id}')" style="background:var(--primary);border:none;color:white;padding:2px 5px;border-radius:3px;cursor:pointer">Sửa Ví</button>
          </td>
        </tr>`).join('')}</tbody></table>`;
      } else if (tab === 'vouchers') {
        b.innerHTML = `
          <div style="display:flex;gap:10px;margin-bottom:1rem">
            <input type="text" id="vCode" placeholder="Mã (VD: SALE20)" style="flex:1;padding:0.5rem;border-radius:5px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:white">
            <select id="vType" style="padding:0.5rem;border-radius:5px;border:1px solid var(--border);background:var(--dark-2);color:white"><option value="percent">%</option><option value="fixed">VNĐ</option></select>
            <input type="number" id="vVal" placeholder="Giá trị" style="width:80px;padding:0.5rem;border-radius:5px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:white">
            <button onclick="createVoucher()" style="background:var(--success);border:none;color:white;padding:0.5rem 1rem;border-radius:5px;cursor:pointer">Tạo</button>
          </div>
          <table class="admin-table"><thead><tr><th>Mã</th><th>Giá trị</th></tr></thead>
          <tbody>${vouchers.map(v => `<tr><td>${v.code}</td><td>${v.type==='percent'?v.value+'%':formatPrice(v.value)}</td></tr>`).join('')}</tbody></table>
        `;
      } else if (tab === 'logs') {
        b.innerHTML = `<table class="admin-table"><thead><tr><th>Thời gian</th><th>Người dùng</th><th>Hành động</th></tr></thead>
        <tbody>${logs.map(l => `<tr><td>${l.time}</td><td>${l.user}</td><td>${l.action}</td></tr>`).join('')}</tbody></table>`;
      }
    }

    // Admin Actions
    window.toggleStatus = (id) => { const u = users.find(x=>x.id===id); u.status = u.status==='active'?'banned':'active'; saveAll(); renderAdminTab('users'); showToast('Đã cập nhật trạng thái!'); }
    window.makeAdmin = (id) => { const u = users.find(x=>x.id===id); u.role = 'admin'; saveAll(); renderAdminTab('users'); showToast('Đã cấp quyền Admin!'); }
    window.editBalance = (id) => { 
      const u = users.find(x=>x.id===id); 
      const v = prompt(`Nhập số dư mới cho ${u.username}:`, u.balance);
      if (v && !isNaN(v)) { u.balance = parseInt(v); addLog(`Admin sửa ví ${u.username} thành ${formatPrice(v)}`); saveAll(); renderAdminTab('users'); showToast('Thành công!'); }
    }
    window.createVoucher = () => {
      const code = document.getElementById('vCode').value.toUpperCase();
      const type = document.getElementById('vType').value;
      const val = parseInt(document.getElementById('vVal').value);
      if (code && val) { vouchers.push({ code, type, value: val }); addLog(`Tạo voucher ${code}`); saveAll(); renderAdminTab('vouchers'); showToast('Tạo mã thành công!'); }
    }

    // Sự kiện DOM chung
    document.addEventListener("DOMContentLoaded", () => {
      renderProducts(); renderAuthUI();
      
      // Dark/Light mode
      const themeBtn = document.getElementById('themeToggle');
      if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); themeBtn.innerHTML = '<i class="fas fa-sun"></i>'; }
      themeBtn.onclick = () => {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        themeBtn.innerHTML = isLight ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
      };

      // Notif dropdown
      document.getElementById('notifBtn').onclick = (e) => { e.stopPropagation(); document.getElementById('notifDropdown').classList.toggle('show'); };
      document.addEventListener('click', () => document.getElementById('notifDropdown').classList.remove('show'));

      // Close Modals
      document.querySelectorAll('.close-btn').forEach(btn => btn.onclick = () => btn.closest('.modal').classList.remove('active'));

      // Auth Tabs
      document.querySelectorAll('.auth-tab').forEach(t => t.onclick = () => {
        document.querySelectorAll('.auth-tab').forEach(x => { x.style.color = 'var(--text-muted)'; x.classList.remove('active') });
        t.style.color = 'var(--text)'; t.classList.add('active');
        const isLogin = t.dataset.auth === 'login';
        document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
        document.getElementById('registerForm').classList.toggle('hidden', isLogin);
      });

      // Form Login
      document.getElementById('loginForm').onsubmit = (e) => {
        e.preventDefault();
        const u = users.find(x => x.username === document.getElementById('loginUser').value && x.password === document.getElementById('loginPass').value);
        if (u) {
          if (u.status === 'banned') return showToast('Tài khoản đã bị khóa!');
          session = { id: u.id }; saveAll(); document.getElementById('authModal').classList.remove('active'); renderAuthUI(); showToast('Đăng nhập thành công!');
        } else showToast('Sai tài khoản hoặc mật khẩu!');
      };

      // Form Register
      document.getElementById('registerForm').onsubmit = (e) => {
        e.preventDefault();
        const u = document.getElementById('regUser').value;
        if (users.find(x => x.username === u)) return showToast('Tên đã tồn tại!');
        users.push({ id: 'u' + Date.now(), username: u, email: document.getElementById('regEmail').value, password: document.getElementById('regPass').value, role: 'user', balance: 0, status: 'active' });
        saveAll(); showToast('Đăng ký thành công!'); document.querySelector('.auth-tab[data-auth="login"]').click(); e.target.reset();
      };

      // Logout
      document.getElementById('logoutBtn').onclick = () => { session = null; saveAll(); renderAuthUI(); document.getElementById('profileModal').classList.remove('active'); showToast('Đã đăng xuất'); };

      // Admin mở modal
      document.getElementById('adminPanelBtn').onclick = () => { document.getElementById('profileModal').classList.remove('active'); document.getElementById('adminModal').classList.add('active'); renderAdminTab('users'); };
      document.querySelectorAll('.admin-tab').forEach(t => t.onclick = () => {
        document.querySelectorAll('.admin-tab').forEach(x => x.classList.remove('active')); t.classList.add('active');
        renderAdminTab(t.dataset.admin);
      });

      // Lịch sử mua
      window.renderHistory = () => {
        const user = getCurrentUser();
        if (!user) return;
        const myOrders = orders.filter(o => o.userId === user.id);
        document.getElementById('quickViewBody').innerHTML = `<h3>Lịch sử mua hàng</h3><br>` + 
          (myOrders.length === 0 ? '<p>Chưa có đơn hàng nào.</p>' : myOrders.map(o => `<div style="border-bottom:1px solid var(--border);padding:10px 0"><b>${o.name}</b><br><span style="color:var(--gold)">${formatPrice(o.price)}</span> - <small style="color:var(--text-muted)">${o.time}</small></div>`).join(''));
        document.getElementById('profileModal').classList.remove('active');
        document.getElementById('quickViewModal').classList.add('active');
      }

      // Giả lập thông báo từ Admin
      setTimeout(() => {
        if (!notifs.find(n => n.id === 'welcome')) {
          notifs.push({ id: 'welcome', userId: 'all', text: 'Chào mừng đến với KeyStore VIP V4!' });
          saveAll(); renderAuthUI();
        }
      }, 2000);
    });
  </script>
</body>
</html>
